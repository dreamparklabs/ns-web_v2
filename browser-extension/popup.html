<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      min-height: 400px;
      padding: 0;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .header {
      padding: 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .header h1 {
      margin: 0 0 5px 0;
      font-size: 18px;
      font-weight: 600;
    }

    .header p {
      margin: 0;
      font-size: 12px;
      opacity: 0.8;
    }

    .content {
      padding: 20px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }

    .status-dot.error {
      background: #ef4444;
    }

    .status-dot.warning {
      background: #f59e0b;
    }

    .button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
    }

    .button:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .button.primary {
      background: rgba(255, 255, 255, 0.9);
      color: #667eea;
    }

    .button.primary:hover {
      background: white;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 15px 0;
    }

    .stat {
      text-align: center;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }

    .stat-number {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 11px;
      opacity: 0.8;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-message {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 10px;
      margin: 10px 0;
      font-size: 12px;
    }

    .success-message {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      padding: 10px;
      margin: 10px 0;
      font-size: 12px;
    }

    .footer {
      padding: 15px 20px;
      text-align: center;
      font-size: 11px;
      opacity: 0.6;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .footer a {
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Northstar D2L Sync</h1>
    <p>Secure D2L data synchronization</p>
  </div>

  <div class="content">
    <div id="loading" class="loading" style="display: none;">
      <div class="spinner"></div>
      <div>Extracting D2L data...</div>
    </div>

    <div id="main-content">
      <div class="status">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Checking D2L page...</span>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-number" id="courses-count">0</div>
          <div class="stat-label">Courses</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="assignments-count">0</div>
          <div class="stat-label">Assignments</div>
        </div>
      </div>

      <button class="button primary" id="extract-btn">
        Extract D2L Data
      </button>

      <button class="button" id="sync-btn" style="display: none;">
        Sync to Northstar
      </button>

      <button class="button" id="open-northstar-btn">
        Open Northstar
      </button>

      <button class="button" id="debug-btn" style="background: #666; font-size: 12px;">
        Debug Info
      </button>

      <div id="message"></div>
    </div>
  </div>

  <div class="footer">
    <a href="http://localhost:5173" target="_blank">Visit Northstar</a> • 
    <a href="#" id="help-link">Help</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
